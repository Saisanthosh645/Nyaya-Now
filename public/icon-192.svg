<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Base background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- Top tricolor bar glow -->
  <path d="M 112 16 L 256 16" stroke="url(#saffron)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 256 16 L 400 16" stroke="url(#green)" stroke-width="12" stroke-linecap="round"/>

  <!-- Shield Shape -->
  <path d="M 256 80 C 340 80 400 120 400 200 C 400 320 256 420 256 420 C 256 420 112 320 112 200 C 112 120 172 80 256 80 Z" 
        fill="#1e293b" 
        stroke="url(#blueGlow)" 
        stroke-width="12" 
        stroke-linejoin="round"
  />

  <!-- Ashoka Chakra Spokes in Center of Shield -->
  <g transform="translate(256, 230)">
    <circle r="60" fill="none" stroke="#38bdf8" stroke-width="8"/>
    <circle r="14" fill="#38bdf8"/>
    <!-- 24 Spokes -->
    <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-60"/>
      <line x1="0" y1="0" x2="15.5" y2="-57.9"/>
      <line x1="0" y1="0" x2="30" y2="-51.9"/>
      <line x1="0" y1="0" x2="42.4" y2="-42.4"/>
      <line x1="0" y1="0" x2="51.9" y2="-30"/>
      <line x1="0" y1="0" x2="57.9" y2="-15.5"/>
      <line x1="0" y1="0" x2="60" y2="0"/>
      <line x1="0" y1="0" x2="57.9" y2="15.5"/>
      <line x1="0" y1="0" x2="51.9" y2="30"/>
      <line x1="0" y1="0" x2="42.4" y2="42.4"/>
      <line x1="0" y1="0" x2="30" y2="51.9"/>
      <line x1="0" y1="0" x2="15.5" y2="57.9"/>
      <line x1="0" y1="0" x2="0" y2="60"/>
      <line x1="0" y1="0" x2="-15.5" y2="57.9"/>
      <line x1="0" y1="0" x2="-30" y2="51.9"/>
      <line x1="0" y1="0" x2="-42.4" y2="42.4"/>
      <line x1="0" y1="0" x2="-51.9" y2="30"/>
      <line x1="0" y1="0" x2="-57.9" y2="15.5"/>
      <line x1="0" y1="0" x2="-60" y2="0"/>
      <line x1="0" y1="0" x2="-57.9" y2="-15.5"/>
      <line x1="0" y1="0" x2="-51.9" y2="-30"/>
      <line x1="0" y1="0" x2="-42.4" y2="-42.4"/>
      <line x1="0" y1="0" x2="-30" y2="-51.9"/>
      <line x1="0" y1="0" x2="-15.5" y2="-57.9"/>
    </g>
  </g>

  <!-- Scales of Justice beam beneath chakra -->
  <g transform="translate(256, 335)">
    <polygon points="0,-16 10,12 -10,12" fill="#f59e0b"/>
    <line x1="-70" y1="-14" x2="70" y2="-14" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="-60" y1="-14" x2="-75" y2="16" stroke="#f59e0b" stroke-width="3"/>
    <line x1="-60" y1="-14" x2="-45" y2="16" stroke="#f59e0b" stroke-width="3"/>
    <path d="M -80 16 Q -60 30 -40 16 Z" fill="#fbbf24"/>
    <line x1="60" y1="-14" x2="45" y2="16" stroke="#f59e0b" stroke-width="3"/>
    <line x1="60" y1="-14" x2="75" y2="16" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 40 16 Q 60 30 80 16 Z" fill="#fbbf24"/>
  </g>
</svg>
